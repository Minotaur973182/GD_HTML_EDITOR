<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geometry Dash Level Editor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="logo">
            GEOMETRY DASH EDITOR
        </div>

        <div class="top-buttons">
            <button id="newLevel">NEW</button>
            <button id="saveLevel">SAVE</button>
            <button id="exportLevel">EXPORT</button>
            <button id="importLevel">IMPORT</button>
        </div>

    </header>


    <!-- MAIN EDITOR -->
    <main class="main">

        <!-- OBJECT LIBRARY -->
        <aside class="sidebar">

            <div class="sidebar-title">
                OBJECTS
            </div>

            <div class="categories">

                <button class="category active" data-category="blocks">
                    BLOCKS
                </button>

                <button class="category" data-category="spikes">
                    SPIKES
                </button>

                <button class="category" data-category="special">
                    SPECIAL
                </button>

            </div>

            <div id="objectList" class="object-list"></div>

        </aside>


        <!-- EDITOR AREA -->
        <section class="editor">

            <div class="editor-header">

                <input
                    id="levelName"
                    value="Untitled Level"
                    maxlength="40"
                >

                <div class="editor-tools">

                    <button class="tool active" data-tool="select">
                        SELECT
                    </button>

                    <button class="tool" data-tool="delete">
                        DELETE
                    </button>

                    <button id="undoButton" class="tool">
                        UNDO
                    </button>

                    <button id="redoButton" class="tool">
                        REDO
                    </button>

                    <button id="playTest" class="play-button">
                        PLAY
                    </button>

                </div>

            </div>


            <!-- CANVAS -->
            <div class="canvas-container">

                <canvas id="gameCanvas"></canvas>

            </div>


            <!-- PLAYTEST CONTROLS -->
            <div id="playtestControls">

                <button id="pauseTest">PAUSE</button>
                <button id="restartTest">RESTART</button>
                <button id="exitTest">EXIT</button>

            </div>


            <!-- BOTTOM BAR -->
            <div class="bottom-bar">

                <span id="coordinates">
                    X: 0 | Y: 0
                </span>

                <span id="objectCount">
                    Objects: 0
                </span>

                <div class="zoom-controls">

                    <button id="zoomOut">-</button>

                    <span id="zoomValue">100%</span>

                    <button id="zoomIn">+</button>

                </div>

            </div>

        </section>

    </main>


    <!-- STATUS BAR -->
    <footer class="statusbar">

        <span id="statusText">
            BUILD MODE
        </span>

        <span>
            WASD / ARROWS: MOVE CAMERA | SCROLL: ZOOM
        </span>

    </footer>


    <input
        type="file"
        id="fileInput"
        accept=".json"
        hidden
    >


    <!-- JAVASCRIPT -->
    <script src="js/objects.js"></script>
    <script src="js/level.js"></script>
    <script src="js/save.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/player.js"></script>
    <script src="js/toolbar.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
